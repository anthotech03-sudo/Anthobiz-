name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy==2.3.0
      - name: Fix SDK and Install Build Tools
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
          echo -e '#!/bin/bash\nexec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"' | sudo tee /usr/local/lib/android/sdk/tools/bin/sdkmanager > /dev/null
          echo -e '#!/bin/bash\nexec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"' | sudo tee /usr/local/lib/android/sdk/tools/bin/android > /dev/null
          sudo chmod +x /usr/local/lib/android/sdk/tools/bin/sdkmanager
          sudo chmod +x /usr/local/lib/android/sdk/tools/bin/android
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "build-tools;37.0.0" "platform-tools" "platforms;android-33"
          ls /usr/local/lib/android/sdk/build-tools/
      - name: Build APK
        run: |
          # Copy everything buildozer needs
          SDK_BUILD=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_BUILD/build-tools
          mkdir -p $SDK_BUILD/licenses
          mkdir -p $SDK_BUILD/tools/bin
          cp -r /usr/local/lib/android/sdk/build-tools/* $SDK_BUILD/build-tools/ || true
          cp -r /usr/local/lib/android/sdk/licenses/* $SDK_BUILD/licenses/ || true
          cp -r /usr/local/lib/android/sdk/platform-tools $SDK_BUILD/ || true
          cp -r /usr/local/lib/android/sdk/platforms $SDK_BUILD/ || true
          cp /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager $SDK_BUILD/tools/bin/ 2>/dev/null || true
          echo -e '#!/bin/bash\nexec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"' > $SDK_BUILD/tools/bin/sdkmanager
          chmod +x $SDK_BUILD/tools/bin/sdkmanager
          chmod +x $SDK_BUILD/build-tools/*/aidl || true
          ls -lh $SDK_BUILD/build-tools/33.0.2/aidl
          ls -lh $SDK_BUILD/build-tools/37.0.0/aidl
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anthobiz-APK
          path: bin/*.apk
