name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy==2.3.0
      - name: Fix Android SDK - Create missing sdkmanager
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
          echo '#!/bin/bash' | sudo tee /usr/local/lib/android/sdk/tools/bin/sdkmanager
          echo 'exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"' | sudo tee -a /usr/local/lib/android/sdk/tools/bin/sdkmanager
          echo '#!/bin/bash' | sudo tee /usr/local/lib/android/sdk/tools/bin/android
          echo 'exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"' | sudo tee -a /usr/local/lib/android/sdk/tools/bin/android
          sudo chmod +x /usr/local/lib/android/sdk/tools/bin/sdkmanager
          sudo chmod +x /usr/local/lib/android/sdk/tools/bin/android
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          ls -lh /usr/local/lib/android/sdk/tools/bin/
      - name: Build APK
        env:
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anthobiz-APK
          path: bin/*.apk
